name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: macOS checks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: bun install --frozen-lockfile
      - run: bun run scripts/check-version.ts
      - run: bun test
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Build macOS application (includes production frontend build)
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: bun run tauri build --ci --bundles app -- --locked

  windows-checks:
    name: Windows x64 checks
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-x64
      - name: Report Windows build environment
        run: |
          git --version
          rustc --version --verbose
      - run: bun install --frozen-lockfile
      - run: bun run scripts/check-version.ts
      - run: bun test
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Build Windows executable (includes production frontend build)
        run: bun run tauri build --ci --target x86_64-pc-windows-msvc --no-bundle -- --locked
      - name: Collect executable and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path distribution -Force | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/branchlight.exe distribution/branchlight.exe
          $checksum = (Get-FileHash distribution/branchlight.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  branchlight.exe" | Set-Content distribution/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v6
        with:
          name: Branchlight-Windows-x64-${{ github.sha }}
          path: distribution/
          if-no-files-found: error
          retention-days: 14
