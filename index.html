<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Branchlight is a focused, local-first Git desktop client for macOS."
    />
    <title>Branchlight</title>
    <script>
      // Resolve before the first paint; changing appearance never needs a Git request.
      (() => {
        let theme = "system";
        try { theme = localStorage.getItem("branchlight.theme") || "system"; } catch {}
        const dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
